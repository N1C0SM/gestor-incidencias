name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela ejecuciones antiguas de la misma rama: ahorra minutos y evita ruido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  calidad:
    name: Lint · Tests · Build · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm run test:ci

      - name: Compilación de producción
        run: npm run build

      - name: Documentación (Compodoc)
        run: npm run docs

      - name: Publicar el bundle de producción
        uses: actions/upload-artifact@v4
        with:
          name: bundle-produccion
          path: www/
          retention-days: 7

      - name: Publicar la documentación
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-compodoc
          path: docs/
          retention-days: 7

  lighthouse:
    name: Informe Lighthouse
    runs-on: ubuntu-latest
    needs: calidad
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para producción
        run: npm run build

      - name: Analizar accesibilidad, buenas prácticas y SEO
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./www
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 1
          configPath: ./.github/lighthouse/lighthouserc.json

      - name: Publicar los informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-lighthouse
          path: .lighthouseci/
          retention-days: 7
